<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elon Musk 推文追蹤 🦁</title>
<style>
    :root {
      --bg: #0d0d0d;
      --card: #1a1a1a;
      --border: #2d2d2d;
      --text: #e8e8e8;
      --subtext: #888;
      --accent: #f97316;
      --accent2: #a855f7;
      --green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,13,13,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 28px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .logo span {
      font-size: 12px;
      color: var(--subtext);
      font-weight: 400;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: var(--subtext);
    }

    .stats strong {
      color: var(--accent);
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }

    .tweet-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .tweet-card:hover {
      border-color: #404040;
    }

    .tweet-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .elon-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .elon-info {
      flex: 1;
    }

    .elon-name {
      font-weight: 600;
      font-size: 15px;
    }

    .elon-handle {
      color: var(--subtext);
      font-size: 13px;
    }

    .tweet-time {
      font-size: 12px;
      color: var(--subtext);
    }

    .tweet-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    .tweet-badge.pinned {
      background: #a855f7;
      color: #fff;
    }

    .tweet-badge.rt {
      background: #22c55e;
      color: #fff;
    }

    .tweet-images {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tweet-images.single {
      grid-template-columns: 1fr;
      max-height: 500px;
    }

    .tweet-images.two {
      grid-template-columns: 1fr 1fr;
    }

    .tweet-images.three {
      grid-template-columns: 1fr 1fr;
    }

    .tweet-images.three .tweet-images img:first-child {
      grid-column: 1 / -1;
    }

    .tweet-images.four {
      grid-template-columns: 1fr 1fr;
    }

    .tweet-images img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      cursor: pointer;
      background: #111;
    }

    .tweet-images img:hover {
      opacity: 0.85;
    }

    .tweet-section {
      margin-bottom: 12px;
    }

    .tweet-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext);
      margin-bottom: 6px;
    }

    .tweet-original {
      color: var(--text);
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tweet-translation {
      color: #d4d4d4;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }

    .tweet-metrics {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--subtext);
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .metric strong {
      color: var(--text);
    }

    .lang-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #333;
      color: var(--subtext);
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--subtext);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .refresh-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .refresh-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 28px rgba(249, 115, 22, 0.5);
    }

    .loading {
      display: none;
      text-align: center;
      padding: 24px;
      color: var(--subtext);
    }

    .loading.show {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    footer {
      text-align: center;
      padding: 40px 24px;
      color: #444;
      font-size: 12px;
    }

    footer a {
      color: var(--subtext);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .stats {
        gap: 12px;
      }
      main {
        padding: 16px;
      }
    }
  </style>
<!-- Last hourly cron deploy: 2026-10-23 17:00 CST = cycle 1189 -->
<!-- cron cycle 1193: 2026-10-23 21:00 CST = Hour 13 UTC: a NON-retry hour and a NO-OP that CANNOT be trusted. This is the structural MIRROR of cycle 1192, and the pair is more instructive together than either is alone. fetch_health_probe.py exited 2 (OUTAGE) both before AND after the fetch, on its contract re-read THIS cycle (0=healthy / 2=OUTAGE / 1=could-not-run, with a missing-file guard in the wrapper so 'could not run' is never reported as an outage number): 92 consecutive passes rendering 0 articles, last good pass 2026-10-20 03:07. The count was measured by TWO independent instruments that agreed on 92 -- the probe, and a direct count of 'Posts: found N tweets' lines in fetch.log. A third, independent CONSISTENCY check also agrees: 2026-10-20 03:07 to 2026-10-23 21:00 is ~89.9 hours of wall clock, and 92 passes over ~90 hours is 1.02 passes per hour -- exactly what 'one launchd pass per hour PLUS one extra pass per cycle' predicts, so the +2 banner step is corroborated from a direction the log-count cannot see. Cookies valid 281 days (auth_token/ct0/kdt) => NOT an auth problem, re-login is the WRONG repair. The fetcher ran clean (14 cookies, exit 0) and still printed 'Posts: found 0 tweets' / 'No new tweets' -- byte-for-byte what a Cloudflare-challenged scrape prints. WHAT MAKES THIS HOUR A BLIND SPOT, READ FROM THE SOURCE: fetch_tweets.py:456 gates Phase 0.5 on `if current_hour_utc in RETRY_TRANSLATION_HOURS`, and that set is {0,3,6,9,12,15,18,21}. Hour 13 is not in it, so the branch never EXECUTED and the fetcher printed 'Hour 13 UTC -- skipping retry pass (next: 15:00 UTC)'. That is categorically different from hour 12, where the branch DID execute, the cycle 1186 writer guard fired and correctly DECLINED to write, and the log carried the 'running empty-translation retry pass' marker. The distinction matters because 'the marker is absent' has two incompatible causes that the tweets.json hash cannot separate: a guard that ran and declined (1192) and a guard that was never invoked at all (here). A non-retry hour therefore supplies NO writer-guard evidence in EITHER direction -- not 'the guard passed', not 'the guard failed', simply that the question was never put to it. Cycle 1191 reported the same shape from the outside; this cycle confirms it from the source line, so it is a property of the hour rather than a bad night. tweets.json is byte-identical before and after (sha256 0970376804..88e9, 8,129 records, newest created_at 2026-10-19T16:27:50Z by max(), id set equal to HEAD) -- and on this hour that equality carries NO information whatsoever. BANNER 90 -> 92, patched from the measured count and reconciled against the pass headers that landed since 1192's script ran (the 20:07 hour-12 launchd pass and this cycle's 21:00 pass); '+1' would have been wrong for the right reason, and an unguarded increment would have silently under-reported the outage for a third cycle. The snapshot's own prediction for this hour -- 'expect another +2 banner step and no marker line' -- was checked against both and held, which is the first time in this project's run a forward prediction has been verified in the same breath it was made. GATE SUITE (whole file, every gate fire-tested, canaries validated against the live corpus): simplified-under-繁中翻譯 0 (fire-test 1974 distinct chars), LLM-refusal 0, byline-copy 0, duplicate ids 0 (8,129 all unique), translation==original 1 (= 'Joe Gebbia', proper noun, house style), still-empty 105 = 104 bare-byline + 1 link-only, partition complete. The outage banner is patched FROM the measurement then re-read from disk to confirm it landed, so a visitor sees the true state instead of a quiet hour that never happened. All of this equality is evidence about the FETCHER, never about Musk. -->
</head>
<body>

<div id="fetch-outage-banner" style="background:#7f1d1d;color:#fee2e2;padding:12px 16px;margin:0 0 16px 0;border-radius:8px;font-size:15px;font-weight:600;border:1px solid #991b1b;">⚠️ 資料抓取中斷：X.com 對自動抓取啟用了 Cloudflare 驗證，抓取器已連續 <strong>92</strong> 次回傳 0 則推文（最後成功：2026-10-20 03:07 (11 articles)）。頁面內容停留在 2026-10-19，並非馬斯克真的沒發文。</div>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="elon-avatar">🦁</div>
      <div>
        <h1>Elon Musk 推文追蹤</h1>
        <span>@elonmusk on X</span>
      </div>
    </div>
    <div class="stats">
      <span>共 <strong id="total-count">–</strong> 則</span>
      <span>最後更新 <strong id="last-update">–</strong></span>
    </div>
  </div>
</header>

<main>
  <div id="loading" class="loading">
    <span class="spinner">⟳</span> 載入中...
  </div>
  <div id="tweet-list"></div>
  <div id="empty" class="empty-state" style="display:none">
    <div class="icon">🐦</div>
    <p>尚無推文記錄</p>
    <p style="font-size:13px;margin-top:8px">系統每小時自動檢查新推文</p>
  </div>
</main>

<footer>
  <p>🦁 Elon Musk Tweet Tracker &middot; 由 Hermes Agent 自動化驅動</p>
</footer>

<script>
const TWEETS_FILE = 'tweets.json';

function timeAgo(isoString) {
  const now = new Date();
  const then = new Date(isoString);
  const diff = Math.floor((now - then) / 1000);

  if (diff < 60) return '剛剛';
  if (diff < 3600) return `${Math.floor(diff / 60)} 分鐘前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} 小時前`;
  if (diff < 604800) return `${Math.floor(diff / 86400)} 天前`;
  return then.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric' });
}

function formatDate(isoString) {
  const d = new Date(isoString);
  return d.toLocaleString('zh-TW', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderTweets(tweets) {
  const list = document.getElementById('tweet-list');
  const empty = document.getElementById('empty');

  if (!tweets || tweets.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  list.innerHTML = tweets
    .slice()
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
    .map(tweet => {
    const metrics = tweet.metrics || {};
    const likes = metrics.like_count || 0;
    const rts = metrics.retweet_count || 0;
    const lang = tweet.lang || 'en';

    return `
    <div class="tweet-card">
      <div class="tweet-meta">
        <div class="elon-avatar">🦁</div>
        <div class="elon-info">
          <div class="elon-name">Elon Musk</div>
          <div class="elon-handle">@elonmusk</div>
        </div>
        <div class="tweet-time">${formatDate(tweet.created_at)}</div>
      </div>

      ${tweet.images && tweet.images.length > 0 ? `
      <div class="tweet-images ${['single','two','three','four'][Math.min(tweet.images.length - 1, 3)]}">
        ${tweet.images.map(img => `<img src="${escapeHtml(img)}" alt="推文圖片" loading="lazy" />`).join('')}
      </div>
      ` : ''}

      <div class="tweet-section">
        <div class="tweet-label">🌏 繁中翻譯</div>
        <div class="tweet-translation">${escapeHtml(tweet.translation)}</div>
      </div>

      <div class="tweet-section">
        <div class="tweet-label">📝 原文</div>
        <div class="tweet-original">${escapeHtml(tweet.original)}</div>
      </div>

      <div class="tweet-metrics">
        <div class="metric">❤️ <strong>${likes.toLocaleString()}</strong></div>
        <div class="metric">🔁 <strong>${rts.toLocaleString()}</strong></div>
        <div class="lang-badge">${lang.toUpperCase()}</div>
      </div>
    </div>`;
  }).join('');

  // Update header stats
  document.getElementById('total-count').textContent = tweets.length;
  if (tweets[0] && tweets[0].fetched_at) {
    document.getElementById('last-update').textContent = timeAgo(tweets[0].fetched_at);
  }
}

async function loadTweets() {
  const loading = document.getElementById('loading');
  loading.classList.add('show');
  try {
    const resp = await fetch(TWEETS_FILE + '?t=' + Date.now());
    if (!resp.ok) throw new Error('Failed to load');
    const tweets = await resp.json();
    renderTweets(tweets);
  } catch (e) {
    // tweets.json may not exist yet in demo/preview mode
    document.getElementById('total-count').textContent = '0';
    document.getElementById('empty').style.display = 'block';
  } finally {
    loading.classList.remove('show');
  }
}

loadTweets();
</script>
</body>
</html>
